<!DOCTYPE html>
<html lang="${lang}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-${nonce}';">
<style>
  :root {
    --bg: #1e1e1e;
    --surface: #252526;
    --border: #3c3c3c;
    --text: #cccccc;
    --text-muted: #808080;
    --accent: #005fa9;
    --accent-hover: #0077cc;
    --badge-bg: #3c3c3c;
    --badge-text: #cccccc;
    --row-hover: #2a2d2e;
    --copied: #2ea043;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --surface: #f3f3f3;
      --border: #e0e0e0;
      --text: #333333;
      --text-muted: #666666;
      --accent: #005fa9;
      --accent-hover: #0077cc;
      --badge-bg: #e8e8e8;
      --badge-text: #333333;
      --row-hover: #f0f0f0;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 8px;
    gap: 6px;
  }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 12px;
    min-width: 0;
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-icon { color: var(--text-muted); font-size: 11px; }

  /* ── Category tabs ── */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .tab {
    padding: 2px 8px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    transition: background 150ms, color 150ms, border-color 150ms;
    white-space: nowrap;
  }
  .tab:hover { border-color: var(--accent); color: var(--text); }
  .tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* ── List ── */
  .list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 0;
  }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 8px;
    padding: 5px 10px;
    border-bottom: 1px solid var(--border);
    cursor: default;
    transition: background 100ms;
  }
  .row:hover { background: var(--row-hover); }

  .row-info { min-width: 0; }
  .row-desc { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-cmd { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .shortcut-badge {
    font-family: 'SF Mono', ui-monospace, 'Cascadia Code', monospace;
    font-size: 11px;
    background: var(--badge-bg);
    color: var(--text);
    padding: 2px 6px;
    border-radius: 3px;
    white-space: nowrap;
    border: 1px solid var(--border);
    white-space: pre;
  }

  .copy-btn {
    padding: 2px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    transition: background 150ms, color 150ms, border-color 150ms;
    white-space: nowrap;
  }
  .copy-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .copy-btn.copied { background: var(--copied); border-color: var(--copied); color: #fff; }

  .empty {
    padding: 24px 10px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>${title}</h1>
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="${tSearch}" autocomplete="off" spellcheck="false">
  </div>
</div>

<div class="tabs" id="tabs"></div>

<div class="list" id="list"></div>

<script nonce="${nonce}">
(function () {
  'use strict';

  const shortcuts = ${shortcutsJson};
  const categories = ${categoriesJson};
  const LABELS = { tCopy: '${tCopy}', tCopied: '${tCopied}', tEmpty: '${tEmpty}' };

  let activeCategory = 'all';
  let searchTerm = '';

  // ── Render tabs ──
  function renderTabs() {
    const el = document.getElementById('tabs');
    el.innerHTML = '';
    categories.forEach(function (cat) {
      const btn = document.createElement('button');
      btn.className = 'tab' + (cat.id === activeCategory ? ' active' : '');
      btn.textContent = cat.label;
      btn.dataset.id = cat.id;
      btn.addEventListener('click', function () {
        activeCategory = cat.id;
        renderTabs();
        renderList();
      });
      el.appendChild(btn);
    });
  }

  // ── Render list ──
  function renderList() {
    const el = document.getElementById('list');
    const term = searchTerm.toLowerCase();
    const filtered = shortcuts.filter(function (s) {
      const matchCat = activeCategory === 'all' || s.category === activeCategory;
      const matchSearch = !term ||
        s.description.toLowerCase().includes(term) ||
        s.shortcut.toLowerCase().includes(term) ||
        s.command.toLowerCase().includes(term);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      el.innerHTML = '<div class="empty">' + LABELS.tEmpty + '</div>';
      return;
    }

    el.innerHTML = '';
    filtered.forEach(function (s) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div class="row-info">' +
          '<div class="row-desc">' + escHtml(s.description) + '</div>' +
          '<div class="row-cmd">' + escHtml(s.command) + '</div>' +
        '</div>' +
        '<code class="shortcut-badge">' + escHtml(s.shortcut) + '</code>' +
        '<button class="copy-btn" data-cmd="' + escAttr(s.shortcut) + '">' + LABELS.tCopy + '</button>';
      el.appendChild(row);
    });

    // Copy buttons
    el.querySelectorAll('.copy-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const cmd = btn.dataset.cmd;
        copyToClipboard(cmd);
        btn.textContent = LABELS.tCopied;
        btn.classList.add('copied');
        setTimeout(function () {
          btn.textContent = LABELS.tCopy;
          btn.classList.remove('copied');
        }, 1500);
      });
    });
  }

  // ── Clipboard ──
  function copyToClipboard(text) {
    if (typeof navigator !== 'undefined' && navigator.clipboard) {
      navigator.clipboard.writeText(text);
    } else {
      // Fallback for older environments
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    // Notify VS Code
    var vscode = acquireVsCodeApi();
    if (vscode) vscode.postMessage({ command: 'copy', data: text });
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escAttr(s) {
    return String(s).replace(/"/g, '&quot;');
  }

  // ── Search ──
  document.getElementById('search').addEventListener('input', function (e) {
    searchTerm = e.target.value;
    renderList();
  });

  // ── Init ──
  renderTabs();
  renderList();
})();
</script>
</body>
</html>
